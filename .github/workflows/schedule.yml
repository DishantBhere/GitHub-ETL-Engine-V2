name: Daily GitHub ETL

run-name: "ETL (${{ github.event_name }})"

on:
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Extract + load to SQLite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline.py

      - name: Update Excel dashboard data
        run: python update_excel.py

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitHub_Trending_Dashboard
          path: GitHub_Trending_Dashboard.xlsx

      - name: Commit refreshed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github_repos.db data/ GitHub_Trending_Dashboard.xlsx
          git diff --cached --quiet || git commit -m "chore: refresh (${{ github.event_name }}) $(date -u +%F\ %H:%M)"
          git pull --rebase origin main
          git push

      - name: Email summary
        if: always()
        continue-on-error: true
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          STATUS: ${{ job.status }}
          TRIGGER: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'EOF'
          import os, ssl, smtplib
          from email.message import EmailMessage

          e = os.environ
          user = e["MAIL_USER"].strip()
          pw = e["MAIL_PASS"].replace(" ", "").strip()
          to = e["MAIL_TO"].strip()
          print("user len:", len(user), "pass len:", len(pw), "to len:", len(to))

          m = EmailMessage()
          m["Subject"] = f"ETL {e['STATUS']}: {e['REPO']}"
          m["From"] = user
          m["To"] = to
          m.set_content(
              f"Status: {e['STATUS']}\n"
              f"Trigger: {e['TRIGGER']}\n"
              f"Run: {e['RUN_URL']}\n"
              f"Repo: https://github.com/{e['REPO']}\n"
          )

          if e["STATUS"] == "success":
              with open("GitHub_Trending_Dashboard.xlsx", "rb") as f:
                  m.add_attachment(
                      f.read(),
                      maintype="application",
                      subtype="vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                      filename="GitHub_Trending_Dashboard.xlsx",
                  )

          with smtplib.SMTP("smtp.gmail.com", 587, timeout=30) as s:
              s.starttls(context=ssl.create_default_context())
              s.login(user, pw)
              s.send_message(m)
          EOF
