name: Daily GitHub ETL
run-name: "ETL (${{ github.event_name }})"   # Actions list shows: schedule / workflow_dispatch

on:
  schedule:
    # --- TEST MODE: every 15 min, off-peak minutes (NOT :00/:30). Proves whether GitHub fires schedules at all.
    - cron: "7,22,37,52 * * * *"
    # --- FINAL MODE (swap in after you see one run with event=schedule). Keep minute odd, off :00/:30.
    # - cron: "17 4 * * *"      # 09:47 AM IST
    # - cron: "47 9 * * *"      # 03:17 PM IST (2nd slot = backup if first tick is dropped; pipeline is idempotent)
  workflow_dispatch:            # manual button

permissions:
  contents: write

concurrency:
  group: daily-etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Extract + load to SQLite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline.py

      - name: Update Excel dashboard data
        run: python update_excel.py

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitHub_Trending_Dashboard
          path: GitHub_Trending_Dashboard.xlsx

      - name: Commit refreshed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github_repos.db data/ GitHub_Trending_Dashboard.xlsx
          git diff --cached --quiet || git commit -m "chore: refresh (${{ github.event_name }}) $(date -u +%F\ %H:%M)"
          git pull --rebase origin main
          git push